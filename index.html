<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Residências da Instável</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="topbar">
      <div class="org"><span class="txt">Instável – Centro Coreográfico</span></div>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="pt">PT</button><span class="dot" aria-hidden="true">·</span><button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <h1>Residências da Instável</h1>
    <p class="sub" data-t="sub"></p>
    <p data-t="intro"></p>
    <ul class="rules" id="rules"></ul>
  </header>

  <!-- Cancelamento por link -->
  <section class="step hidden" id="cancelBox">
    <h2 data-t="cancelTitle"></h2>
    <p data-t="cancelText"></p>
    <div class="actions">
      <button class="btn danger" id="cancelBtn" data-t="cancelBtn"></button>
      <a href="./" class="linkbtn" id="backLink" data-t="back"></a>
    </div>
    <div id="cancelMsg"></div>
  </section>

  <div id="bookingFlow">
    <section class="step">
      <h2><span class="n">1.</span><span data-t="s1"></span></h2>
      <p class="hint" id="calHint"></p>
      <div class="cal-head">
        <button class="iconbtn" id="prevM" type="button">‹</button>
        <div class="month" id="monthLabel"></div>
        <button class="iconbtn" id="nextM" type="button">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i></i><span data-t="lgFree"></span></span>
        <span><i class="p"></i><span data-t="lgPartial"></span></span>
        <span><i class="f"></i><span data-t="lgFull"></span></span>
        <span><i class="s"></i><span data-t="lgSel"></span></span>
      </div>
      <div class="counter" id="counter"></div>
      <div id="calMsg"></div>
    </section>

    <section class="step">
      <h2><span class="n">2.</span><span data-t="s2"></span></h2>
      <p class="hint" id="timeHint"></p>
      <div class="sel-list" id="selList"></div>
      <div class="actions hidden" id="copyWrap"><button class="linkbtn" id="copyTimes" type="button" data-t="copy"></button></div>
    </section>

    <section class="step">
      <h2><span class="n">3.</span><span data-t="s3"></span></h2>
      <form id="form" novalidate>
        <div class="fields">
          <div><label for="name"><span data-t="fName"></span> <span class="req">*</span></label><input id="name" autocomplete="name" required maxlength="120"></div>
          <div><label for="email"><span data-t="fEmail"></span> <span class="req">*</span></label><input id="email" type="email" autocomplete="email" required maxlength="160"></div>
          <div><label for="phone"><span data-t="fPhone"></span> <span class="req">*</span></label><input id="phone" type="tel" autocomplete="tel" required maxlength="40"></div>
          <div class="full">
            <label for="team"><span data-t="fTeam"></span> <span class="req">*</span></label>
            <textarea id="team" required maxlength="1000" data-tp="fTeamPh"></textarea>
            <p class="note" data-t="fTeamNote"></p>
          </div>
          <div class="full"><label for="notes" data-t="fNotes"></label><textarea id="notes" maxlength="1000"></textarea></div>
        </div>
        <div class="actions">
          <button class="btn" type="submit" id="submitBtn" data-t="submit"></button>
        </div>
        <div id="formMsg"></div>
      </form>
    </section>
  </div>

  <section class="step done hidden" id="doneBox">
    <h2 data-t="doneTitle"></h2>
    <p id="doneText"></p>
    <div class="actions" style="justify-content:center"><a class="btn ghost" href="./" id="againLink" data-t="again"></a></div>
  </section>
</div>

<script>
(function () {
  'use strict';
  var API = window.RESERVAS_API;

  // ---------- textos ----------
  var T = {
    pt: {
      sub: 'Reserva de estúdio',
      intro: 'Escolhe os dias e os horários pretendidos para a tua residência. O pedido fica pendente até ser aprovado pela equipa da Instável – receberás a confirmação por e-mail.',
      rules: function (c) { return ['Das ' + c.openHour + 'h às ' + c.closeHour + 'h', 'Máx. ' + c.maxHoursPerDay + 'h por dia', 'Até ' + c.maxDaysPerRequest + ' dias por pedido', 'Sujeito a aprovação']; },
      s1: 'Dias',
      hint1: function (n) { return 'Clica nos dias que pretendes reservar um estúdio (até ' + n + ' dias por pedido). Para retirar os dias, clica de novo.'; },
      prevM: 'Mês anterior', nextM: 'Mês seguinte',
      lgFree: 'Livre', lgPartial: 'Parcialmente disponível', lgFull: 'Sem disponibilidade', lgSel: 'Escolhido',
      counter: 'Dias escolhidos',
      s2: 'Horários',
      hint2: function (c) { return 'Entre as ' + c.openHour + 'h e as ' + c.closeHour + 'h, no máximo ' + c.maxHoursPerDay + ' horas por dia.'; },
      empty: 'Ainda não escolheste nenhum dia.',
      copy: 'Aplicar o horário do primeiro dia a todos os dias',
      noFree: 'Sem estúdio livre: ',
      start: 'Início', end: 'Fim', remove: 'Retirar',
      s3: 'Dados pessoais',
      fName: 'Nome', fEmail: 'E-mail', fPhone: 'Contacto telefónico',
      fTeam: 'Equipa que estará presente', fTeamPh: 'Nomes das pessoas que vão estar no estúdio',
      fTeamNote: 'Nota: Por razões de controlo de segurança, só as pessoas indicadas aqui poderão entrar na Instável. Caso queiras adicionar mais pessoas depois de fazeres a reserva, envia e-mail para palcosinstaveis@gmail.com, por favor.',
      fNotes: 'Observações',
      submit: 'Enviar pedido de reserva', sending: 'A enviar…',
      doneTitle: 'Pedido enviado',
      doneText: function (e) { return 'Obrigado! O teu pedido ficou <b>pendente de aprovação</b>. Enviámos um resumo para <b>' + e + '</b>. Quando a equipa aprovar, receberás um novo e-mail de confirmação.'; },
      again: 'Fazer outro pedido',
      cancelTitle: 'Cancelar pedido de reserva',
      cancelText: 'Confirmas que pretendes cancelar este pedido ou reserva? Todos os dias associados ficam livres.',
      cancelBtn: 'Confirmar cancelamento', cancelling: 'A cancelar…', back: 'Voltar',
      cancelDone: 'Cancelado. Enviámos uma confirmação para o teu e-mail.',
      eMax: function (n) { return 'Cada pedido pode ter no máximo ' + n + ' dias. Podes fazer outro pedido depois deste.'; },
      ePickDay: 'Escolhe pelo menos um dia (ponto 1).',
      eFill: 'Preenche nome, e-mail, contacto telefónico e equipa.',
      eEmail: 'O e-mail não parece válido.',
      eLoad: 'Não foi possível carregar a disponibilidade. Verifica a ligação e atualiza a página.',
      eSend: 'Não foi possível enviar o pedido. Verifica a ligação e tenta novamente.',
      eCancel: 'Não foi possível cancelar. Tenta novamente.',
      eDown: 'A plataforma está temporariamente indisponível.',
      eCopy: function (l) { return 'Não foi possível aplicar o mesmo horário em: ' + l + ' (sem estúdio livre nesse período).'; },
      eDropped: function (l) { return 'Entretanto deixou de haver disponibilidade, retirado: ' + l + '.'; },
      wd: ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'],
      wdl: ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'],
      mo: ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'],
      mof: ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro']
    },
    en: {
      sub: 'Studio booking',
      intro: 'Choose the days and times you would like for your residency. Your request will remain pending until it is approved by the Instável team – you will receive a confirmation by e-mail.',
      rules: function (c) { return [c.openHour + ':00 to ' + c.closeHour + ':00', 'Max. ' + c.maxHoursPerDay + 'h per day', 'Up to ' + c.maxDaysPerRequest + ' days per request', 'Subject to approval']; },
      s1: 'Days',
      hint1: function (n) { return 'Click the days on which you would like to book a studio (up to ' + n + ' days per request). To remove a day, click it again.'; },
      prevM: 'Previous month', nextM: 'Next month',
      lgFree: 'Available', lgPartial: 'Partially available', lgFull: 'Unavailable', lgSel: 'Selected',
      counter: 'Selected days',
      s2: 'Times',
      hint2: function (c) { return 'Between ' + c.openHour + ':00 and ' + c.closeHour + ':00, max. ' + c.maxHoursPerDay + ' hours per day.'; },
      empty: 'You have not selected any days yet.',
      copy: 'Apply the first day\'s times to all days',
      noFree: 'No studio available: ',
      start: 'Start', end: 'End', remove: 'Remove',
      s3: 'Personal details',
      fName: 'Name', fEmail: 'E-mail', fPhone: 'Phone number',
      fTeam: 'Team members who will be present', fTeamPh: 'Names of the people who will be in the studio',
      fTeamNote: 'Note: For security reasons, only the people listed here will be allowed into Instável. If you would like to add more people after making your booking, please send an e-mail to palcosinstaveis@gmail.com.',
      fNotes: 'Notes',
      submit: 'Send booking request', sending: 'Sending…',
      doneTitle: 'Request sent',
      doneText: function (e) { return 'Thank you! Your request is <b>pending approval</b>. We have sent a summary to <b>' + e + '</b>. Once the team approves it, you will receive a confirmation e-mail.'; },
      again: 'Make another request',
      cancelTitle: 'Cancel booking request',
      cancelText: 'Are you sure you want to cancel this request or booking? All the days in it will become available again.',
      cancelBtn: 'Confirm cancellation', cancelling: 'Cancelling…', back: 'Back',
      cancelDone: 'Cancelled. We have sent a confirmation to your e-mail.',
      eMax: function (n) { return 'Each request can include at most ' + n + ' days. You can make another request afterwards.'; },
      ePickDay: 'Please choose at least one day (step 1).',
      eFill: 'Please fill in name, e-mail, phone number and team.',
      eEmail: 'The e-mail address does not seem valid.',
      eLoad: 'Availability could not be loaded. Please check your connection and refresh the page.',
      eSend: 'The request could not be sent. Please check your connection and try again.',
      eCancel: 'The cancellation could not be completed. Please try again.',
      eDown: 'The platform is temporarily unavailable.',
      eCopy: function (l) { return 'The same times could not be applied to: ' + l + ' (no studio available then).'; },
      eDropped: function (l) { return 'No longer available, removed: ' + l + '.'; },
      wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      wdl: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
      mo: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
      mof: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
    }
  };

  var lang = 'pt';
  var cfg = null;            // configuração vinda do servidor
  var view = null;           // primeiro dia do mês visível
  var avail = {};            // 'AAAA-MM-DD' -> [[ini,fim], ...] (um intervalo por evento no calendário)
  var loaded = {};           // 'AAAA-MM' -> promessa
  var selected = {};         // 'AAAA-MM-DD' -> { start: min, end: min }
  var cancelMode = false;

  var $ = function (id) { return document.getElementById(id); };
  function t(k) { return T[lang][k]; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function hhmm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function human(k) { var d = fromKey(k); return t('wdl')[d.getDay()] + ', ' + d.getDate() + ' ' + t('mo')[d.getMonth()]; }
  function msg(el, text, kind) { $(el).innerHTML = text ? '<div class="msg ' + (kind || 'err') + '"></div>' : ''; if (text) $(el).firstChild.textContent = text; }
  function escHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function apiGet(params) {
    params.lang = lang;
    return fetch(API + '?' + new URLSearchParams(params)).then(function (r) { return r.json(); });
  }
  function apiPost(body) {
    body.lang = lang;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  // ---------- idioma ----------
  // Entra sempre em português; inglês só pelo botão EN ou por links com ?lang=en (ex.: e-mails)
  function pickLang() {
    return new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'pt';
  }
  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(function (el) { var v = t(el.getAttribute('data-t')); if (typeof v === 'string') el.textContent = v; });
    document.querySelectorAll('[data-tp]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-tp')); });
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === l)); });
    $('prevM').setAttribute('aria-label', t('prevM')); $('nextM').setAttribute('aria-label', t('nextM'));
    var suffix = l === 'en' ? '?lang=en' : '?lang=pt';
    $('againLink').href = './' + suffix; $('backLink').href = './' + suffix;
    if (cfg) { renderRules(); render(); }
  }
  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { setLang(b.getAttribute('data-lang')); }; });

  // ---------- disponibilidade ----------
  function busyFor(k) { return avail[k] || null; }
  function nowMinutesIf(k) {
    if (k !== key(today())) return -1;
    var n = new Date(); return n.getHours() * 60 + n.getMinutes();
  }
  // "Ocupado" = já há tantos eventos em simultâneo como estúdios
  function isBusy(busy, a, b) {
    var n = 0;
    for (var i = 0; i < busy.length; i++) if (busy[i][0] < b && busy[i][1] > a) n++;
    return n >= cfg.capacity;
  }
  function startOptions(k) {
    var busy = busyFor(k); if (!busy) return [];
    var out = [], step = cfg.stepMinutes, now = nowMinutesIf(k);
    for (var tm = cfg.openHour * 60; tm + step <= cfg.closeHour * 60; tm += step) {
      if (tm <= now) continue;
      if (!isBusy(busy, tm, tm + step)) out.push(tm);
    }
    return out;
  }
  function endOptions(k, start) {
    var busy = busyFor(k) || [], out = [], step = cfg.stepMinutes;
    var max = Math.min(cfg.closeHour * 60, start + cfg.maxHoursPerDay * 60);
    for (var tm = start + step; tm <= max; tm += step) {
      if (isBusy(busy, tm - step, tm)) break;
      out.push(tm);
    }
    return out;
  }
  function limitDate() { var d = today(); return new Date(d.getFullYear(), d.getMonth() + cfg.maxMonthsAhead, d.getDate()); }
  function dayStatus(k) {
    var d = fromKey(k);
    if (d < today() || d > limitDate()) return 'off';
    if (!busyFor(k)) return 'loading';
    var free = startOptions(k).length;
    var total = (cfg.closeHour - cfg.openHour) * 60 / cfg.stepMinutes;
    if (!free) return 'full';
    return free === total ? 'free' : 'partial';
  }

  function loadMonth(d) {
    var first = new Date(d.getFullYear(), d.getMonth(), 1), last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    var wk = key(first).slice(0, 7);
    if (loaded[wk]) return loaded[wk];
    var p = apiGet({ action: 'availability', from: key(first), to: key(last) }).then(function (res) {
      if (!res.ok) throw new Error(res.error);
      Object.keys(res.days).forEach(function (k) { avail[k] = res.days[k]; });
    }).catch(function () {
      delete loaded[wk];
      msg('calMsg', t('eLoad'));
    });
    loaded[wk] = p;
    return p;
  }
  function refreshAll() {
    avail = {}; loaded = {};
    var months = {}; months[key(view).slice(0, 7)] = view;
    Object.keys(selected).forEach(function (k) { months[k.slice(0, 7)] = fromKey(k); });
    return Promise.all(Object.keys(months).map(function (m) { return loadMonth(months[m]); }));
  }

  // ---------- desenho ----------
  function renderRules() {
    $('rules').innerHTML = '';
    t('rules')(cfg).forEach(function (r) { var li = document.createElement('li'); li.textContent = r; $('rules').appendChild(li); });
  }

  function renderCalendar() {
    $('monthLabel').textContent = t('mof')[view.getMonth()] + ' ' + view.getFullYear();
    var td = today(), lim = limitDate();
    $('prevM').disabled = view.getFullYear() === td.getFullYear() && view.getMonth() === td.getMonth();
    $('nextM').disabled = view.getFullYear() * 12 + view.getMonth() >= lim.getFullYear() * 12 + lim.getMonth();
    var g = $('grid'); g.innerHTML = '';
    [1, 2, 3, 4, 5, 6, 0].forEach(function (i) { var h = document.createElement('div'); h.className = 'dow'; h.textContent = t('wd')[i]; g.appendChild(h); });
    var first = new Date(view.getFullYear(), view.getMonth(), 1);
    for (var i = 0; i < (first.getDay() + 6) % 7; i++) g.appendChild(document.createElement('div'));
    var n = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (var dd = 1; dd <= n; dd++) {
      var k = key(new Date(view.getFullYear(), view.getMonth(), dd));
      var st = dayStatus(k);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'day ' + (selected[k] ? 'sel' : st);
      b.innerHTML = '<span class="dn">' + dd + '</span>';
      b.disabled = !selected[k] && st !== 'free' && st !== 'partial';
      var lbl = human(k);
      if (selected[k]) lbl += ' – ' + t('lgSel'); else if (st === 'partial') lbl += ' – ' + t('lgPartial'); else if (st === 'full') lbl += ' – ' + t('lgFull');
      b.setAttribute('aria-label', lbl);
      b.setAttribute('aria-pressed', String(!!selected[k]));
      b.onclick = (function (k) { return function () { toggleDay(k); }; })(k);
      g.appendChild(b);
    }
    $('counter').innerHTML = escHtml(t('counter')) + ': <b>' + Object.keys(selected).length + ' / ' + cfg.maxDaysPerRequest + '</b>';
    $('calHint').textContent = t('hint1')(cfg.maxDaysPerRequest);
  }

  function toggleDay(k) {
    msg('calMsg', '');
    if (selected[k]) { delete selected[k]; render(); return; }
    if (Object.keys(selected).length >= cfg.maxDaysPerRequest) { msg('calMsg', t('eMax')(cfg.maxDaysPerRequest), 'info'); return; }
    var starts = startOptions(k); if (!starts.length) return;
    // sugere o horário do primeiro dia escolhido, se couber; senão o primeiro período livre
    var ref = firstSelected();
    var s = starts[0], e;
    if (ref && starts.indexOf(ref.start) !== -1 && endOptions(k, ref.start).indexOf(ref.end) !== -1) { s = ref.start; e = ref.end; }
    else { var ends = endOptions(k, s); e = ends[ends.length - 1]; }
    selected[k] = { start: s, end: e };
    render();
  }
  function firstSelected() { var ks = Object.keys(selected).sort(); return ks.length ? selected[ks[0]] : null; }

  function revalidateSelection() {
    var dropped = [];
    Object.keys(selected).forEach(function (k) {
      if (!busyFor(k)) return; // ainda a carregar
      var starts = startOptions(k), sel = selected[k];
      if (!starts.length) { dropped.push(human(k)); delete selected[k]; return; }
      if (starts.indexOf(sel.start) === -1) sel.start = starts[0];
      var ends = endOptions(k, sel.start);
      if (ends.indexOf(sel.end) === -1) sel.end = ends[ends.length - 1];
    });
    if (dropped.length) msg('calMsg', t('eDropped')(dropped.join('; ')), 'info');
  }

  // Períodos do dia sem nenhum estúdio livre
  function busyText(k) {
    var busy = busyFor(k) || [], step = cfg.stepMinutes, out = [], cur = null;
    for (var tm = cfg.openHour * 60; tm < cfg.closeHour * 60; tm += step) {
      if (isBusy(busy, tm, tm + step)) { if (cur && cur[1] === tm) cur[1] = tm + step; else { cur = [tm, tm + step]; out.push(cur); } }
    }
    if (!out.length) return '';
    return t('noFree') + out.map(function (x) { return hhmm(x[0]) + '–' + hhmm(x[1]); }).join(', ');
  }

  function renderSelection() {
    var ks = Object.keys(selected).sort();
    var list = $('selList'); list.innerHTML = '';
    $('timeHint').textContent = t('hint2')(cfg);
    $('copyWrap').classList.toggle('hidden', ks.length < 2);
    if (!ks.length) { var p = document.createElement('p'); p.className = 'empty'; p.textContent = t('empty'); list.appendChild(p); return; }
    ks.forEach(function (k) {
      var sel = selected[k];
      var row = document.createElement('div'); row.className = 'sel-row';
      var d = document.createElement('div'); d.className = 'date'; d.textContent = human(k);
      var s = document.createElement('select'); s.setAttribute('aria-label', t('start') + ' – ' + human(k));
      startOptions(k).forEach(function (tm) { s.add(new Option(hhmm(tm), tm, false, tm === sel.start)); });
      var e = document.createElement('select'); e.setAttribute('aria-label', t('end') + ' – ' + human(k));
      endOptions(k, sel.start).forEach(function (tm) { e.add(new Option(hhmm(tm), tm, false, tm === sel.end)); });
      var h = document.createElement('div'); h.className = 'hrs';
      h.textContent = ((sel.end - sel.start) / 60).toString().replace('.', lang === 'pt' ? ',' : '.') + 'h';
      var x = document.createElement('button'); x.type = 'button'; x.className = 'xbtn'; x.textContent = '×'; x.setAttribute('aria-label', t('remove') + ' ' + human(k));
      s.onchange = function () {
        sel.start = +s.value;
        var ends = endOptions(k, sel.start);
        if (ends.indexOf(sel.end) === -1) sel.end = ends[ends.length - 1];
        renderSelection();
      };
      e.onchange = function () { sel.end = +e.value; renderSelection(); };
      x.onclick = function () { delete selected[k]; render(); };
      row.appendChild(d); row.appendChild(s); row.appendChild(e); row.appendChild(h); row.appendChild(x);
      var bt = busyText(k);
      if (bt) { var b = document.createElement('div'); b.className = 'busy'; b.textContent = bt; row.appendChild(b); }
      list.appendChild(row);
    });
  }

  function render() { renderCalendar(); renderSelection(); }

  $('copyTimes').onclick = function () {
    var ks = Object.keys(selected).sort(), ref = selected[ks[0]], bad = [];
    ks.slice(1).forEach(function (k) {
      if (startOptions(k).indexOf(ref.start) !== -1 && endOptions(k, ref.start).indexOf(ref.end) !== -1) {
        selected[k].start = ref.start; selected[k].end = ref.end;
      } else bad.push(human(k));
    });
    renderSelection();
    msg('calMsg', bad.length ? t('eCopy')(bad.join('; ')) : '', 'info');
  };

  function goMonth(n) { view = new Date(view.getFullYear(), view.getMonth() + n, 1); render(); loadMonth(view).then(render); }
  $('prevM').onclick = function () { goMonth(-1); };
  $('nextM').onclick = function () { goMonth(1); };

  // ---------- envio ----------
  $('form').onsubmit = function (ev) {
    ev.preventDefault();
    msg('formMsg', '');
    var data = {
      action: 'request',
      name: $('name').value.trim(), email: $('email').value.trim(), phone: $('phone').value.trim(),
      team: $('team').value.trim(), notes: $('notes').value.trim(),
      slots: Object.keys(selected).sort().map(function (k) { return { date: k, start: hhmm(selected[k].start), end: hhmm(selected[k].end) }; })
    };
    if (!data.slots.length) return msg('formMsg', t('ePickDay'));
    if (!data.name || !data.email || !data.phone || !data.team) return msg('formMsg', t('eFill'));
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return msg('formMsg', t('eEmail'));
    var btn = $('submitBtn'); btn.disabled = true; btn.textContent = t('sending');
    apiPost(data).then(function (res) {
      if (!res.ok) {
        msg('formMsg', res.error);
        return refreshAll().then(function () { revalidateSelection(); render(); });
      }
      $('bookingFlow').classList.add('hidden');
      $('doneText').innerHTML = t('doneText')(escHtml(data.email));
      $('doneBox').classList.remove('hidden');
      window.scrollTo(0, 0);
    }).catch(function () {
      msg('formMsg', t('eSend'));
    }).then(function () { btn.disabled = false; btn.textContent = t('submit'); });
  };

  // ---------- cancelamento por link ----------
  function setupCancel(id, tk) {
    cancelMode = true;
    $('bookingFlow').classList.add('hidden');
    $('cancelBox').classList.remove('hidden');
    $('cancelBtn').onclick = function () {
      var b = $('cancelBtn'); b.disabled = true; b.textContent = t('cancelling');
      apiPost({ action: 'cancel', requestId: id, token: tk }).then(function (res) {
        if (!res.ok) { msg('cancelMsg', res.error); b.disabled = false; b.textContent = t('cancelBtn'); return; }
        b.classList.add('hidden');
        msg('cancelMsg', t('cancelDone'), 'info');
      }).catch(function () { msg('cancelMsg', t('eCancel')); b.disabled = false; b.textContent = t('cancelBtn'); });
    };
  }

  // ---------- arranque ----------
  function init() {
    setLang(pickLang());
    var q = new URLSearchParams(location.search);
    if (q.get('cancelar') && q.get('t')) setupCancel(q.get('cancelar'), q.get('t'));
    view = new Date(today().getFullYear(), today().getMonth(), 1);
    if (cancelMode) return;
    $('calHint').textContent = '…';
    apiGet({ action: 'config' }).then(function (res) {
      if (!res.ok) throw new Error(res.error);
      cfg = res.config;
      renderRules(); render();
      return loadMonth(view).then(render);
    }).catch(function () { msg('calMsg', t('eDown')); });
  }
  init();
})();
</script>
</body>
</html>
